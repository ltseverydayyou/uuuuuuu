name: Apply F3X mobile touch patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          Path('/tmp/f3x.patch').write_bytes(gzip.decompress(base64.b64decode("")))
          PY
          git apply --ignore-space-change --ignore-whitespace /tmp/f3x.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('F3X.luau')
          data = p.read_bytes()
          if data.startswith(b'\xef\xbb\xbf'):
              data = data[3:]
          text = data.decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
          p.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/f3x-mobile-touch-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve F3X mobile touch controls"
          git push origin HEAD:main
