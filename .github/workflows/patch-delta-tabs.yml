name: Patch Delta Tabs
"on":
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_delta_tabs.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_delta_tabs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaCustomizationModule.luau
          git rm .github/scripts/patch_delta_tabs.py .github/workflows/patch-delta-tabs.yml .github/workflows/patch-delta-tab-sequence.yml
          git commit -m "fix: normalize Delta tab numbering"
          git push
