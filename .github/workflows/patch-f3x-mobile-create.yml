name: Patch F3X Mobile Create

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch F3X mobile create fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('F3X.luau')
          b = p.read_bytes()
          needle = b'BTMobileGizmo:create()\r\nF3XTrackConnection(UserInputService.InputChanged:Connect(function(input)\r\n'
          insert = b'''BTMobileGizmo:create()\r\nF3XTrackConnection(UserInputService.TouchTapInWorld:Connect(function(position)\r\n\tif not UserInputService.TouchEnabled or CurrentTool ~= Tools.NewPart then\r\n\t\treturn\r\n\tend\r\n\tlocal fakeInput = {\r\n\t\tPosition = Vector3.new(position.X, position.Y, 0),\r\n\t\tUserInputType = Enum.UserInputType.Touch,\r\n\t}\r\n\tif isPointerOverBTUI(fakeInput) then\r\n\t\treturn\r\n\tend\r\n\tlocal listener = Tools.NewPart.Listeners and Tools.NewPart.Listeners.Button1Down\r\n\tif not listener then\r\n\t\treturn\r\n\tend\r\n\tlistener(fakeInput)\r\n\tif Tools.Move and Tools.Move.Dragger then\r\n\t\tTools.Move:FinishDragging()\r\n\tend\r\nend))\r\nF3XTrackConnection(UserInputService.InputChanged:Connect(function(input)\r\n'''
          if needle not in b:
              raise SystemExit('patch insertion point not found')
          if b'UserInputService.TouchTapInWorld:Connect(function(position)' not in b:
              b = b.replace(needle, insert, 1)
          p.write_bytes(b)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add F3X.luau
          git rm .github/workflows/patch-f3x-mobile-create.yml
          git commit -m "fix: mobile F3X create world taps"
          git push